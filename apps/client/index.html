<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Poprock</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <form id="join">
      <h1>POPROCK</h1>
      <p>Home galaxy · shared crew</p>
      <input id="name" maxlength="24" placeholder="Pilot name" autocomplete="off" />
      <button type="submit">Come aboard</button>
      <p class="hint">Mouse/keyboard or gamepad. Press <b>?</b> in game for controls.</p>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
